<div class="signup-wrapper">
  <div class="signup-container">
    <!-- Left Side - Image -->
    <div class="signup-left">
      <div class="image-content">
        <img src="assets/loginnregimg.png" alt="Signup Illustration" />
      </div>
    </div>

    <!-- Right Side - Form -->
    <div class="signup-right">
      <div class="form-container">
        <div class="form-header">
          <h2>Create Account</h2>
          <p>Join us today and get started</p>
        </div>

        <form [formGroup]="validateForm" (ngSubmit)="submitForm()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Full Name</mat-label>
            <input 
              matInput 
              formControlName="name" 
              placeholder="John Doe" 
            />
            <mat-error *ngIf="validateForm.get('name')?.invalid && validateForm.get('name')?.touched">
              Name is required
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input 
              matInput 
              formControlName="email" 
              placeholder="example@email.com" 
              type="email" 
            />
            <mat-error *ngIf="validateForm.get('email')?.invalid && validateForm.get('email')?.touched">
              Valid email is required
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input 
              matInput 
              formControlName="password" 
              placeholder="Enter your password" 
              type="password" 
            />
            <mat-error *ngIf="validateForm.get('password')?.invalid && validateForm.get('password')?.touched">
              Minimum 6 characters required
            </mat-error>
          </mat-form-field>

          <button 
            mat-raised-button 
            color="primary" 
            type="submit"
            class="signup-btn" 
            [disabled]="validateForm.invalid"
          >
            Register
          </button>

          <p class="login-link">
            Already have an account? 
            <a routerLink="/login">Login here</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
